resolved_decisions:
  - Pin de org.testcontainers:testcontainers-bom: FUERA de alcance. Pasa a cambio de seguimiento
    dedicado. Compatibilidad con camunda-process-test-java 8.7.6 sin verificar; no puede estar en el
    camino crítico de este entregable. Sigue siendo la cobertura durable contra el rollout de Docker 29.
  - Colisión con manual-review-camunda-form: la guarda de motivo en reject() la posee ESTE cambio.
    Acción pendiente del orquestador: dar de baja esa línea del alcance y del criterio de éxito de
    manual-review-camunda-form (y de su capacidad review-decision-audit) antes de escribir su spec.
    Esta propuesta no editó sus archivos.

coordination:
  manual-review-camunda-form:
    action: remover del alcance «Guarda de dominio: reject() exige motivo con contenido»
    owner_now: ci-and-domain-tests
    status: flagged_not_applied

critical_risks:
  - Rollout de Docker 29.1.x en runners de GitHub (anunciado 30-ene-2026, no presente en la imagen
    del 20-jul-2026) rompería CI con el mismo HTTP 400 que la máquina local.

verified_facts:
  - ubuntu-24.04 imagen 20260720.247.2 declara Docker Server 28.0.4, no 29.x.
  - JDK por defecto de ubuntu-latest es 17; CI debe fijar 21 explícitamente.
  - reject() no valida hoy el contenido del motivo (CreditApplication.java:145-154).
  - pom.xml sin dependencyManagement ni propiedad testcontainers.version; el intento
    -Dtestcontainers.version=1.21.3 fue un no-op, no evidencia de incompatibilidad.
  - El único llamador productivo de reject() es NotificationWorker.reasonFor(), que siempre devuelve
    un literal no vacío. La guarda de motivo no puede romper los 4 tests de proceso existentes.
  - README.md:144 contiene la fila «**Tests de proceso ejecutados** | ❌ **no**» que este cambio cierra.

design_decisions:
  reject_guard_exception: IllegalArgumentException # coherente con submit(); un motivo vacío no tiene
    # estado que culpar, y InvalidApplicationStateException estructura su mensaje sobre el estado
  reject_guard_position: antes del corto de idempotencia # hace la guarda total; reject("") sobre una
    # solicitud ya REJECTED lanza en lugar de retornar. Seguro: los retries de Zeebe reenvían el mismo
    # literal no vacío
  reason_storage: tal como se recibe # la guarda valida, no normaliza con trim lo que se persiste
  test_class: CreditApplicationTest con @Nested por operación
  test_naming: sufijo Test # válido bajo los includes por defecto de Surefire y bajo los de Spring Boot
  new_dependencies: none # spring-boot-starter-test ya aporta JUnit Jupiter, AssertJ y junit-jupiter-params
  ci_jobs: single job build
  maven_wrapper: false # cambio de seguimiento
  ci_triggers: push a main + pull_request a main, con concurrency cancel-in-progress

environment_verified_2026_07_29:
  java_home: C:\Program Files\Android\Android Studio\jbr — JDK 21.0.10, javac 21.0.10
  java_home_previous_claim: INCORRECTO en openspec/config.yaml, que decía JDK 8
  mvn_on_path: false # mvn no está instalado
  java_on_path: false # solo accesible por ruta completa al JBR
  local_maven_repo: ausente # no existe ~/.m2, la primera build debe descargar todo el árbol
  maven_available_via: scoop install maven # 3.9.16 en el bucket main
  resolved: >
    RESUELTO el mismo día. Maven 3.9.16 instalado con «scoop install maven» y verificado:
    mvn -B test-compile desde cero dio BUILD SUCCESS en 30 s, 37 fuentes principales + 1 de test,
    release 21, con ~/.m2 recreado (120 MB). El comando es reproducible.
  consequence_historica: >
    El working_command «mvn test-compile» declarado en openspec/config.yaml estuvo NO ejecutable:
    el BUILD SUCCESS registrado se produjo con un JDK y un Maven portables temporales de una sesión
    anterior, en un directorio temp ya limpiado. Lección: registrar el comando no alcanza, hay que
    registrar de qué depende.
  opportunity: >
    Con Maven instalado, los tests unitarios de dominio SÍ son ejecutables localmente: no necesitan
    Docker. El bloqueo de Docker 29 solo afecta a CreditOriginationProcessTest. TDD estricto pasa a ser
    verificable de verdad para la capa de dominio, que es justo la que este cambio agrega.
